# Settings for all parts in this folder.
#
# 01_run_all_scripts.sh either asks for each value below (1 or ENTER), using
# the comment above it as the question and saving the answers back here, or
# installs silently with this file as it is (2). Single parts read it directly.
# Changed a value after the installation? Run the part that uses it again.

# Your domain for HTTPS, e.g. app.example.com: point its DNS at this server
# first, and Caddy gets and renews the certificate itself. Keep ":80" for
# plain HTTP via the server's IP address. (07_config_caddy.sh)
CUSTOM_DOMAIN=":80"

# Pocketbase superuser, for the admin UI at /_/ (08_config_pocketbase.sh).
POCKETBASE_EMAIL="user@provider.com"

# Its password, at least 8 characters. Empty = a random one, shown once at the
# end (type random in the step-by-step setup). A password typed there is never
# saved here.
POCKETBASE_PASS=""

# Start these services automatically: true or false (07–10).
AUTOSTART_CADDY=true
AUTOSTART_POCKETBASE=true
AUTOSTART_FILEBROWSER=true

# The Node app stays off until you've uploaded it (see 10_config_nodeapp.sh).
AUTOSTART_NODEAPP=false

# Its start file in /myapps/nodeapp, and the port it must listen on
# (process.env.PORT).
NODEAPP_RUN=index.js
NODEAPP_PORT=8092

# Major versions that updates stay within (06_install_or_update_binaries.sh).
# Moving to a new one is a deliberate step: Filebrowser v1 → v2, for example,
# replaced its whole database.
NODE_MAJOR=22
FILEBROWSER_MAJOR=2
